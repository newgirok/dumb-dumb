name: open-world-casual-journey

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    env_file:
      - .env.local
    environment:
      - WATCHPACK_POLLING=true
    restart: unless-stopped
    depends_on:
      - realtime

  app-prod:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        # 비어 있으면 빈 문자열이 넘어가 Dockerfile 기본값을 덮으므로 여기서도 기본값을 둔다
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:9002}
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    profiles:
      - prod
    depends_on:
      - realtime

  # 실시간 서버(apps/realtime, socket.io) — DB 없이 뜬다. 브라우저가 NEXT_PUBLIC_WS_URL(9002)로 직접 붙는다
  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    ports:
      - "9002:9002"
    environment:
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:3000}
      # /world 토큰 검증용 — 비어 있으면 /world 접속만 거절한다
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-}

volumes:
  node_modules:
  next_cache:
