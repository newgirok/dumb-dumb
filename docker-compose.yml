services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    env_file:
      - .env.local
    environment:
      - WATCHPACK_POLLING=true
    restart: unless-stopped

volumes:
  node_modules:
  next_cache:
